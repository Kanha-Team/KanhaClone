name: Bug Report
description: Create a report to help us improve KanhaClone
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Python / Environment Version
      description: e.g. Python 3.12 / Ubuntu 24.04 / Docker
      placeholder: Python 3.12
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Please copy and paste any relevant log output (remove private tokens!).
      render: shell
